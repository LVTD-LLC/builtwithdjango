<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Campaign.Subject }}</title>
  <style>
    @font-face { font-family: Rubik; font-style: normal; font-weight: 600; src: url('https://builtwithdjango.com/static/frontend/src/fonts/rubik-normal-latin.b65daadded74.woff2') format('woff2'); }
    @font-face { font-family: 'Nunito Sans'; font-style: normal; font-weight: 400; src: url('https://builtwithdjango.com/static/frontend/src/fonts/nunitosans-normal-latin.e010923d59d4.woff2') format('woff2'); }
    body { margin: 0; padding: 0; background: #f8f7f3; color: #202b27; }
    table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
    .content { font-family: 'Nunito Sans', 'Segoe UI', Arial, sans-serif; font-size: 17px; line-height: 1.65; overflow-wrap: anywhere; }
    .content h1, .content h2, .content h3 { font-family: Rubik, 'Segoe UI', Arial, sans-serif; font-weight: 600; color: #202b27; line-height: 1.3; }
    .content h1 { font-size: 30px; margin: 0 0 24px; }
    .content h2 { font-size: 23px; margin: 32px 0 12px; }
    .content h3 { font-size: 19px; margin: 24px 0 8px; }
    .content p, .content ul, .content ol { margin: 0 0 20px; }
    .content a { color: #286347; text-decoration: underline; }
    .content img { max-width: 100%; height: auto; border: 0; }
    .content blockquote { margin: 24px 0; padding: 16px 20px; background: #e6eee6; border-left: 3px solid #286347; }
    .content hr { border: 0; border-top: 1px solid #dcdfd7; margin: 28px 0; }
    .content pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f2f0e9; padding: 16px; font-size: 14px; }
    .content .button { display: inline-block; padding: 12px 20px; background: #286347; color: #ffffff; border-radius: 6px; font-weight: 700; text-decoration: none; }
    @media only screen and (max-width: 620px) {
      .outer { padding: 12px 10px !important; }
      .pad { padding-left: 22px !important; padding-right: 22px !important; }
      .content h1 { font-size: 26px !important; }
      .brand { font-size: 21px !important; }
    }
  </style>
  <!--[if mso]><style>body, table, td, p, a, h1, h2, h3 { font-family: Arial, sans-serif !important; }</style><![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f8f7f3;color:#202b27;">
  <table role="presentation" width="100%" bgcolor="#f8f7f3" style="width:100%;background-color:#f8f7f3;">
    <tr><td class="outer" align="center" style="padding:40px 16px;">
      <!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
      <table role="presentation" width="100%" style="width:100%;max-width:600px;">
        <tr><td class="pad" style="padding:8px 36px 28px;">
          <table role="presentation"><tr>
            <td width="52" valign="middle" style="width:52px;"><a href="https://builtwithdjango.com/" style="text-decoration:none;"><img src="https://builtwithdjango.com/static/vendors/images/logo.ee701a5f0ffc.png" width="40" height="40" alt="Django hexagon" style="display:block;border:0;width:40px;height:40px;"></a></td>
            <td valign="middle"><a class="brand" href="https://builtwithdjango.com/" style="font-family:Rubik,'Segoe UI',Arial,sans-serif;font-size:24px;font-weight:600;line-height:1.2;color:#202b27;text-decoration:none;">Built with Django</a></td>
          </tr></table>
          <p style="margin:18px 0 0;font-family:'Nunito Sans','Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5;color:#606b64;">Real projects. Practical guides. The Django community.</p>
        </td></tr>
        <tr><td class="content pad" bgcolor="#ffffff" style="padding:36px;background-color:#ffffff;border:1px solid #dcdfd7;border-top:3px solid #286347;font-family:'Nunito Sans','Segoe UI',Arial,sans-serif;font-size:17px;line-height:1.65;color:#202b27;">
          {{ template "content" . }}
        </td></tr>
        <tr><td class="pad" style="padding:24px 36px;font-family:'Nunito Sans','Segoe UI',Arial,sans-serif;font-size:13px;line-height:1.7;color:#606b64;">
          <p style="margin:0 0 12px;">You're receiving the Built with Django newsletter because you subscribed.</p>
          <p style="margin:0 0 12px;"><a href="https://builtwithdjango.com/projects/" style="color:#286347;text-decoration:underline;">Explore projects</a> &nbsp;&middot;&nbsp; <a href="https://builtwithdjango.com/blog/" style="color:#286347;text-decoration:underline;">Read the blog</a></p>
          <p style="margin:0;"><a href="{{ UnsubscribeURL }}" style="color:#606b64;text-decoration:underline;">{{ L.T "email.unsub" }}</a> &nbsp;&middot;&nbsp; <a href="{{ MessageURL }}" style="color:#606b64;text-decoration:underline;">{{ L.T "email.viewInBrowser" }}</a></p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
