{% load static %}
{% load widget_tweaks %}

<div data-controller="like"
     data-like-project-id-value="{{ site.id }}"
     data-like-count-value="{{ site.like_count|default:0 }}"
     data-like-liked-value="{{ site.user_has_liked|yesno:'true,false' }}"
     data-like-toggle-url-value="{% url 'api_project_like_toggle' site.id %}"
     class="inline-flex">
  {% csrf_token %}
  {% if user.is_authenticated %}
    <button data-action="click->like#modify"
            data-analytics-event="project like button clicked"
            data-analytics-project-id="{{ site.id }}"
            data-analytics-project-title="{{ site.title }}"
            class="bw-icon-button gap-1"
            type="button"
            aria-label="Like {{ site.title }}"
            {% if user.is_authenticated %}aria-pressed="{{ site.user_has_liked|yesno:'true,false' }}"{% endif %}>
      <span class="text-sm font-black" data-like-target="numberOfLikes">{{ site.like_count|default:0 }}</span>
      <i data-like-target="heart"
         class="{% if site.user_has_liked %}text-red-600 las{% else %}lar{% endif %} la-heart block"
         aria-hidden="true"></i>
    </button>
  {% else %}
    <button data-action="click->like#toggleModal"
            data-like-target="modalButton"
            data-analytics-project-id="{{ site.id }}"
            data-analytics-project-title="{{ site.title }}"
            class="bw-icon-button gap-1"
            type="button"
            aria-label="Like {{ site.title }}"
            {% if user.is_authenticated %}aria-pressed="{{ site.user_has_liked|yesno:'true,false' }}"{% endif %}>
      <span class="text-sm font-black" data-like-target="numberOfLikes">{{ site.like_count|default:0 }}</span>
      <i data-like-target="heart"
         class="{% if site.user_has_liked %}text-red-600 las{% else %}lar{% endif %} la-heart block"
         aria-hidden="true"></i>
    </button>
    <dialog data-like-target="modal" data-action="close->like#modalClosed" class="bw-auth-dialog" aria-labelledby="like-title-{{ site.id }}">
      <div class="flex items-start justify-between gap-4"><h2 id="like-title-{{ site.id }}" class="bw-heading-md">Keep your favorites.</h2><button type="button" class="bw-icon-button" data-action="like#toggleModal" aria-label="Close dialog">×</button></div>
      <p class="bw-muted mt-4 leading-7">Sign in to like projects and show the builders your support.</p>
      <div class="mt-6 flex flex-wrap gap-3"><a href="{% url 'account_login' %}?next={{ request.path|urlencode }}" class="bw-button bw-button-primary">Sign in</a><a href="{% url 'account_signup' %}" class="bw-button bw-button-secondary">Create account</a><button type="button" class="bw-text-link" data-action="like#toggleModal">Keep browsing</button></div>
    </dialog>
  {% endif %}
</div>
